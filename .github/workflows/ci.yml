name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile pipeline/ingest.py pipeline/validate.py pipeline/orchestrate.py
      - name: Run ingestion
        run: python pipeline/ingest.py
      - name: Run validation
        run: python pipeline/validate.py
      - name: Run dbt models
        run: |
          cd dbt_pipeline
          dbt run --profiles-dir .
      - name: Run dbt tests
        run: |
          cd dbt_pipeline
          dbt test --profiles-dir .
